[project]
name = "citry-bootstrap"
version = "0.1.0"
description = "Bootstrap 5 components for citry"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "citry>=0.5.0",
]
authors = [
    { name = "Joey Jurjens", email = "joeyjurjens@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]
keywords = ["citry", "components", "bootstrap"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/citry_bootstrap"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",          # pycodestyle errors
    "W",          # pycodestyle warnings
    "F",          # pyflakes
    "I",          # isort
    "B",          # flake8-bugbear
    "C4",         # flake8-comprehensions
    "UP",         # pyupgrade
]
ignore = [
    "E501",  # line-too-long
]

[tool.ruff.lint.isort]
known-first-party = ["citry_bootstrap"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14.5",
]

docs = [
    "mkdocs>=1.6",
    "pymdown-extensions>=10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
